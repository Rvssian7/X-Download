<!DOCTYPE html>
<html>
<head>
    <title>X-Download</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; padding: 40px 20px; background: #050505; color: #ededed; font-weight: 300; }
        h1 { color: #fff; font-weight: 600; margin-bottom: 5px; font-size: 28px; letter-spacing: -0.5px;}
        .header-meta { color: #666; font-size: 13px; margin-bottom: 30px;}
        .path { color: #999; font-family: monospace; background: #1a1a1a; padding: 3px 6px; border-radius: 4px; border: 1px solid #222;}
        
        .card { max-width: 650px; margin: auto; }
        
        .download-item { background: #121212; padding: 24px; border-radius: 12px; border: 1px solid #222; margin-bottom: 16px; display: flex; flex-direction: column; position: relative;}
        
        .filename { font-weight: 500; margin-bottom: 6px; color: #fff; font-size: 15px; padding-right: 20px; letter-spacing: -0.2px;}
        .fileurl { font-size: 11px; color: #555; margin-bottom: 16px; word-break: break-all; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        
        .controls { margin-top: 16px; display: flex; gap: 8px; align-items: center;}
        
        button { padding: 8px 16px; border: 1px solid #333; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 500; background: #0a0a0a; color: #aaa; transition: all 0.2s ease; outline: none;}
        button:hover { background: #222; color: #fff; border-color: #555;}
        
        .btn-delete:hover { border-color: #ff4444; color: #ff4444; background: rgba(255,68,68,0.05); }
        .btn-start { background: #fff; color: #000; border: none; font-weight: 600;}
        .btn-start:hover { background: #ddd; color: #000; border: none;}
        
        .progress-bar-container { width: 100%; background: #222; border-radius: 4px; height: 3px; margin: 8px 0; overflow: hidden; }
        .progress-bar { height: 100%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); background-color: #444;}
        .progress-bar.active { background-color: #00ffcc; box-shadow: 0 0 10px rgba(0, 255, 204, 0.2); }
        .progress-bar.error { background-color: #ff4444; }
        .progress-bar.completed { background-color: #fff; }
        
        .stats { display: flex; justify-content: space-between; font-size: 12px; color: #888; margin-top: 8px; font-variant-numeric: tabular-nums; }
        .status-text { color: #ccc; font-weight: 500; }
        
        .badge { background: #1a1a1a; border: 1px solid #333; padding: 2px 6px; border-radius: 4px; font-size: 9px; margin-left: 8px; color: #888; letter-spacing: 0.5px; vertical-align: middle;}
        
        select { padding: 8px 12px; border-radius: 8px; background: #0a0a0a; color: #ccc; border: 1px solid #333; outline: none; font-size: 12px; appearance: auto; }
        select:focus { border-color: #666; }
        
        /* Modal Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 9999; }
        .modal { background: #121212; border: 1px solid #333; border-radius: 12px; width: 100%; max-width: 400px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal h2 { margin-top: 0; font-size: 18px; margin-bottom: 20px; font-weight: 500; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; }
        .form-group input { width: 100%; box-sizing: border-box; padding: 10px; background: #0a0a0a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 13px; outline: none; }
        .form-group input:focus { border-color: #00ffcc; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
    </style>
</head>
<body>
    <!-- Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h2>⚙️ Configuración (V2)</h2>
            <div class="form-group">
                <label>Directorio Base de Descargas</label>
                <input type="text" id="set-dir" placeholder="/Users/ruta/Downloads">
            </div>
            <div class="form-group">
                <label>Máximas Descargas Simultáneas</label>
                <input type="number" id="set-limit" min="1" max="20" placeholder="3">
            </div>
            <div class="form-group">
                <label>Límite de Velocidad Global (Opcional)</label>
                <input type="text" id="set-speed" placeholder="Ej: 5M, 500K (Vacío para ilimitado)">
            </div>
            <div class="modal-footer">
                <button onclick="closeSettings()">Cancelar</button>
                <button class="btn-start" onclick="saveSettings()">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>X-Download</h1>
            <button onclick="openSettings()" style="background: transparent; border: none; font-size: 20px; padding: 0; margin: 0; color: #666;">⚙️</button>
        </div>
        <p class="header-meta">Almacenamiento: <span class="path" id="display-path">{{ download_dir }}</span></p>
        
        <div style="display: flex; gap: 8px; margin-bottom: 20px;">
            <input type="text" id="manual-url" placeholder="Pega cualquier enlace aquí (YouTube, ZIP, PDF...)" style="flex: 1; padding: 10px; border-radius: 8px; background: #0a0a0a; border: 1px solid #333; color: #fff; outline: none; font-size: 13px;">
            <button class="btn-start" onclick="sendManualUrl()">Descargar</button>
        </div>

        <div id="downloads-container"><p style="color: #444; font-size: 13px;">No hay descargas recientes.</p></div>
    </div>

    <script>
        function sendAction(id, action, quality='') {
            fetch('/action', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id: id, action: action, quality: quality})
            });
        }
        
        function startVideo(id) {
            const q = document.getElementById('q_'+id).value;
            sendAction(id, 'start_video', q);
        }

        function renderProgress(data) {
            const container = document.getElementById('downloads-container');
            if (Object.keys(data).length === 0) {
                container.innerHTML = '<p style="color: #444; font-size: 13px;">No hay descargas recientes.</p>';
                return;
            }
            
            if (container.innerHTML.includes("No hay descargas recientes.")) {
                container.innerHTML = '';
            }

            Array.from(container.children).forEach(child => {
                if (child.id && child.id.startsWith('dl_')) {
                    const realId = child.id.replace('dl_', '');
                    if (!data[realId]) child.remove();
                }
            });

            // Sort keys by created_at (oldest first, so prepending puts newest at top)
            let sortedKeys = Object.keys(data).sort((a, b) => {
                let dateA = new Date(data[a].created_at || '1970-01-01').getTime();
                let dateB = new Date(data[b].created_at || '1970-01-01').getTime();
                return dateA - dateB;
            });
            
            sortedKeys.forEach(id => {
                const info = data[id];
                let dlDiv = document.getElementById('dl_' + id);
                
                if (!dlDiv) {
                    dlDiv = document.createElement('div');
                    dlDiv.id = 'dl_' + id;
                    dlDiv.className = 'download-item';
                    container.appendChild(dlDiv);
                    
                    let typeBadge = info.is_video ? '<span class="badge">VIDEO</span>' : '<span class="badge">ARCHIVO</span>';
                    
                    let controlsHtml = '';
                    if (info.status === "Esperando Calidad") {
                        controlsHtml = `
                            <select id="q_${id}">
                                <option value="best">Máxima Calidad</option>
                                <option value="1080p">1080p Máximo</option>
                                <option value="720p">720p (Rápido)</option>
                                <option value="audio">Solo Audio</option>
                            </select>
                            <button class="btn-start" onclick="startVideo('${id}')">Iniciar</button>
                        `;
                    } else {
                        controlsHtml = `
                            <span id="btn_pause_${id}"></span>
                            <span id="btn_resume_${id}"></span>
                        `;
                    }
                    controlsHtml += `<button class="btn-delete" onclick="sendAction('${id}', 'delete')">Eliminar</button>`;
                    
                    dlDiv.innerHTML = `
                        <div class="filename">
                            ${info.title || 'Video'} 
                            <span class="badge">${info.is_video ? 'VIDEO' : 'ARCHIVO'}</span>
                            <span style="float:right; font-size: 11px; color: #555; font-weight: normal;">${info.created_at || ''}</span>
                        </div>
                        <div class="fileurl">${info.url}</div>
                        <div class="progress-bar-container">
                            <div id="bar_${id}" class="progress-bar"></div>
                        </div>
                        <div class="stats">
                            <span id="st_${id}"></span>
                            <span id="sz_${id}"></span>
                            <span id="sp_${id}"></span>
                            <span id="eta_${id}"></span>
                        </div>
                        <div class="controls" id="ctrl_${id}">${controlsHtml}</div>
                    `;
                    container.prepend(dlDiv);
                }
                
                let isActive = (info.status === "Descargando" || info.status === "Iniciando..." || info.status === "En cola");
                
                let widthStr = "0%";
                if (info.percent && info.percent.includes("%")) widthStr = info.percent.replace(/[^0-9.]/g, '') + "%";
                else if (info.status === "Completado") widthStr = "100%";
                
                let bar = document.getElementById('bar_' + id);
                if (bar) {
                    bar.style.width = widthStr;
                    let barClass = 'progress-bar ';
                    if (isActive && info.status !== "En cola") barClass += 'active';
                    if (info.status === "Completado") barClass += 'completed';
                    if (info.status === "Error" || info.status === "Cancelado") barClass += 'error';
                    bar.className = barClass;
                }
                
                let st = document.getElementById('st_' + id);
                if (st) {
                    let color = '#aaa';
                    if (isActive) color = '#00ffcc';
                    if (info.status === "En cola") color = '#ffc107'; // Amarillo para en cola
                    if (info.status === "Error" || info.status === "Cancelado") color = '#ff4444';
                    if (info.status === "Completado") color = '#fff';
                    
                    let icon = '';
                    if (info.status === "En cola") icon = '⏳ ';
                    
                    st.innerHTML = `<span class="status-text" style="color: ${color}">${icon}${info.status}</span> ${info.percent !== "0%" ? ' ' + info.percent : ''}`;
                }
                
                let sz = document.getElementById('sz_' + id);
                if (sz) sz.innerText = info.size || '';
                let sp = document.getElementById('sp_' + id);
                if (sp) sp.innerText = info.speed || '';
                let eta = document.getElementById('eta_' + id);
                if (eta) eta.innerText = info.eta ? 'Faltan: ' + info.eta : '';
                
                let ctrl = document.getElementById('ctrl_' + id);
                if (info.status !== "Esperando Calidad" && ctrl.innerHTML.includes('<select')) {
                    ctrl.innerHTML = `
                        <span id="btn_pause_${id}"></span>
                        <span id="btn_resume_${id}"></span>
                        <button class="btn-delete" onclick="sendAction('${id}', 'delete')">Eliminar</button>
                    `;
                }
                
                let pBtn = document.getElementById('btn_pause_' + id);
                if (pBtn) pBtn.innerHTML = isActive ? `<button onclick="sendAction('${id}', 'pause')">Pausar</button> <button onclick="sendAction('${id}', 'cancel')">Cancelar</button>` : '';
                
                let rBtn = document.getElementById('btn_resume_' + id);
                if (rBtn) rBtn.innerHTML = (info.status === "Pausado" || info.status === "Error" || info.status === "Cancelado") ? `<button onclick="sendAction('${id}', 'resume')">Reanudar</button>` : '';
            });
        }
        
        let ws = new WebSocket(`ws://${location.host}/ws`);
        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            renderProgress(data);
        };
        ws.onclose = function(e) {
            console.error('WebSocket cerrado. Se requiere recargar.');
        };

        function openSettings() {
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        async function saveSettings() {
            const data = {
                download_dir: document.getElementById('set-dir').value,
                max_concurrent: parseInt(document.getElementById('set-limit').value) || 3,
                speed_limit: document.getElementById('set-speed').value
            };
            
            const btn = document.querySelector('.modal-footer .btn-start');
            btn.innerText = "Guardando...";
            
            await fetch('/settings', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            
            document.getElementById('display-path').innerText = data.download_dir;
            btn.innerText = "Guardar Cambios";
            closeSettings();
        }

        async function loadInitialSettings() {
            try {
                const res = await fetch('/settings');
                const data = await res.json();
                document.getElementById('set-dir').value = data.download_dir;
                document.getElementById('set-limit').value = data.max_concurrent;
                document.getElementById('set-speed').value = data.speed_limit;
                document.getElementById('display-path').innerText = data.download_dir;
            } catch(e) {}
        }

        async function sendManualUrl() {
            const urlInput = document.getElementById('manual-url');
            let url = urlInput.value.trim();
            if (!url) return;
            
            // Smart GitHub detection
            if (url.includes("github.com") && !url.endsWith(".zip")) {
                const match = url.match(/github\.com\/([^\/]+\/[^\/\?#]+)/);
                if (match) {
                    let repoPath = match[1];
                    if (repoPath.endsWith(".git")) repoPath = repoPath.slice(0, -4);
                    url = `https://github.com/${repoPath}/archive/refs/heads/main.zip`;
                }
            }
            
            let isVideo = url.includes("youtube.com") || url.includes("youtu.be") || url.includes("vimeo.com");
            
            urlInput.value = 'Enviando...';
            urlInput.disabled = true;
            
            await fetch('/download', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    url: url,
                    is_video: isVideo,
                    title: "Descarga Manual"
                })
            });
            
            urlInput.value = '';
            urlInput.disabled = false;
        }

        loadInitialSettings();
    </script>
</body>
</html>
