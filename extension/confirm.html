<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>X-Download - Confirmar</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; margin: 0; display: flex; flex-direction: column; justify-content: center; height: 100vh; box-sizing: border-box;}
        h2 { margin-top: 0; font-size: 16px; margin-bottom: 15px; color: #00ffcc;}
        .filename { background: #1a1a1a; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 25px; word-break: break-all; border: 1px solid #333; color: #ccc;}
        .buttons { display: flex; gap: 10px; justify-content: center; }
        button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s;}
        .btn-cancel { background: #333; color: #fff; }
        .btn-cancel:hover { background: #444; }
        .btn-start { background: #fff; color: #000; }
        .btn-start:hover { background: #ddd; }
    </style>
</head>
<body>
    <h2>🚀 ¿Enviar a X-Download?</h2>
    <div class="filename" id="fname">Cargando...</div>
    <div class="buttons">
        <button class="btn-cancel" id="btn-cancel">Cancelar</button>
        <button class="btn-start" id="btn-start">Iniciar Descarga</button>
    </div>
    <script src="confirm.js"></script>
</body>
</html>
